name: golangci-lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/setup-go@v7 — latest version, runs on Node.js 24
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      # golangci/golangci-lint-action@v9 — latest version, runs on Node.js 24
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: 'goinstall'   # Build from source using Go 1.26
